<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consulta SINAPI · OBIM Orça</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1d2622; --muted:#5b6862; --line:#d9dedb;
  --accent:#b8611d; --accent-soft:#f6e6d6; --steel:#2f5d62; --steel-soft:#dceae9; --warn:#a36a00; --warn-soft:#fbefd2;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#e6ebe8; --muted:#9aa8a1; --line:#33403b;
  --accent:#e08a44; --accent-soft:#3a2a1c; --steel:#7fb5ba; --steel-soft:#1f3436; --warn:#e3b04d; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#e6ebe8; --muted:#9aa8a1; --line:#33403b;
  --accent:#e08a44; --accent-soft:#3a2a1c; --steel:#7fb5ba; --steel-soft:#1f3436; --warn:#e3b04d; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}
h1 span{color:var(--accent)}
a{color:var(--steel);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.grow{flex:1 1 260px}
label{font-weight:700;font-size:.9rem}
input,select{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);border-color:var(--accent)}
.info{font-size:.92rem;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--steel-soft);color:var(--steel);font-weight:600}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:0 6px 6px 0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.c{font-family:var(--f-mono);color:var(--accent);white-space:nowrap}
mark{background:var(--accent-soft);color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Consulta <span>SINAPI</span></h1>
    <a href="index.html">Voltar ao assistente</a>
  </header>
  <div class="bar">
    <div class="f grow"><label for="q">Buscar serviço ou material</label><input id="q" type="text" placeholder="Ex.: alvenaria bloco cerâmico 14" autocomplete="off"></div>
    <div class="f"><label for="uf">Estado</label><select id="uf"></select></div>
    <div class="f"><label for="tipo">Tipo</label><select id="tipo"><option value="composicoes">Composições (serviços)</option><option value="insumos">Insumos (materiais e mão de obra)</option></select></div>
    <div class="f"><label for="reg">Regime</label><select id="reg"><option value="3">Não desonerado</option><option value="4">Desonerado</option></select></div>
  </div>
  <div class="info" id="info" role="status">Carregando a base…</div>
  <div class="tbl"><table>
    <thead><tr><th>Código</th><th>Descrição</th><th>Unid.</th><th style="text-align:right">Custo (R$)</th></tr></thead>
    <tbody id="res"></tbody>
  </table></div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const UFS=["AC","AL","AM","AP","BA","CE","DF","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"];
let pref={};try{pref=JSON.parse(localStorage.getItem("obimorca.rascunho")||"{}")}catch(e){}
$("uf").innerHTML=UFS.map(u=>`<option ${u===(pref.uf||"GO")?"selected":""}>${u}</option>`).join("");
if(pref.desonerado==="sim")$("reg").value="4";
const cache={};let meta=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmt=n=>n==null?"—":n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

async function carregar(uf){
  if(cache[uf])return cache[uf];
  const r=await fetch(`dados/sinapi/${uf}.json`);
  if(!r.ok)throw new Error("sem dados");
  const d=await r.json();
  for(const t of ["composicoes","insumos"])d[t].forEach(x=>x.push(norm(x[0]+" "+x[1])));
  return cache[uf]=d;
}
async function buscar(){
  const uf=$("uf").value,tipo=$("tipo").value,reg=+$("reg").value,q=norm($("q").value.trim());
  if(!meta||!meta.referencia){
    $("info").innerHTML=`<div class="note">A base SINAPI ainda não foi baixada para o site. O robô mensal faz isso sozinho; na primeira vez, rode a ação <b>Atualizar SINAPI e publicar site</b> na aba Actions do GitHub.</div>`;
    $("res").innerHTML="";return;
  }
  let d;try{d=await carregar(uf)}catch(e){$("info").textContent=`Não há dados de ${uf} nesta referência.`;$("res").innerHTML="";return}
  const termos=q.split(/\s+/).filter(Boolean);
  const lista=d[tipo].filter(x=>termos.every(t=>x[5].includes(t)));
  const mostra=lista.slice(0,200);
  $("info").innerHTML=`<span class="tag">SINAPI ${esc(meta.referencia)} · ${uf}</span> ${lista.length.toLocaleString("pt-BR")} resultado(s)${lista.length>200?", mostrando os 200 primeiros. Refine a busca.":"."}`;
  const hl=s=>{let h=esc(s);termos.forEach(t=>{if(t.length>2){const i=norm(s).indexOf(t);if(i>=0){h=esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+t.length))+"</mark>"+esc(s.slice(i+t.length))}}});return h};
  $("res").innerHTML=mostra.map(x=>`<tr><td class="c">${esc(x[0])}</td><td>${hl(x[1])}</td><td>${esc(x[2])}</td><td class="n">${fmt(x[reg])}</td></tr>`).join("");
}
let tm;["q"].forEach(id=>$(id).addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(buscar,200)}));
["uf","tipo","reg"].forEach(id=>$(id).addEventListener("change",buscar));
fetch("dados/sinapi/meta.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(m=>{meta=m;buscar()});
})();
</script>
</body>
</html>
