<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBIM Orça</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 8 8 2l7 6v7H1z%22 fill=%22%23b8611d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: régua de etapas à esquerda (vira faixa no topo no celular), ficha de preenchimento ao centro, painel "por quê" ao lado */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1d2622; --muted:#5b6862; --line:#d9dedb;
  --accent:#b8611d; --accent-soft:#f6e6d6; --steel:#2f5d62; --steel-soft:#dceae9;
  --ok:#2e7d4f; --warn:#a36a00; --warn-soft:#fbefd2;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#e6ebe8; --muted:#9aa8a1; --line:#33403b;
  --accent:#e08a44; --accent-soft:#3a2a1c; --steel:#7fb5ba; --steel-soft:#1f3436;
  --ok:#6cc58f; --warn:#e3b04d; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#e6ebe8; --muted:#9aa8a1; --line:#33403b;
  --accent:#e08a44; --accent-soft:#3a2a1c; --steel:#7fb5ba; --steel-soft:#1f3436;
  --ok:#6cc58f; --warn:#e3b04d; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:12px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top h1 span{color:var(--accent)}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
/* régua */
nav.steps{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:1000px){nav.steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
nav.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.steps button .n{font-family:var(--f-mono);font-size:.8rem;width:26px;height:26px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none}
nav.steps button.done .n{background:var(--steel);border-color:var(--steel);color:var(--surface)}
nav.steps button.cur{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.steps button.cur .n{border-color:var(--accent);color:var(--accent)}
/* ficha */
main.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
main h2{font-family:var(--f-display);font-size:1.45rem;margin:4px 0 6px;text-wrap:balance}
main .lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.fields{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700}
.hint{font-size:.9rem;color:var(--muted);max-width:62ch}
input[type=text],input[type=number],input[type=month],select{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:360px;width:100%}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.choice{position:relative;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice b{font-family:var(--f-display);font-weight:700}
.choice small{color:var(--muted);font-size:.86rem;line-height:1.35}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.why{all:unset;cursor:pointer;font-size:.85rem;color:var(--steel);font-weight:600;text-decoration:underline;text-underline-offset:3px;width:max-content}
.why:focus-visible{outline:2px solid var(--accent)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:99px;background:var(--steel-soft);color:var(--steel);font-weight:600}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.92rem;max-width:68ch}
/* tabela BDI */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
td input[type=number]{width:90px;padding:5px 8px;text-align:right;font-family:var(--f-mono)}
.range{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.9rem;font-weight:600}
.btn.small.on{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 16px;border:1.5px solid var(--steel);border-radius:8px;background:var(--steel-soft)}
.result .big{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--steel);font-variant-numeric:tabular-nums}
.status{font-weight:700}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.formula{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);overflow-x:auto;white-space:nowrap;padding:8px 0}
/* etapas */
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;align-items:start}
.stage input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.stage b{font-weight:700}
.stage small{grid-column:2;color:var(--muted);font-size:.88rem}
.stage .code{font-family:var(--f-mono);color:var(--accent);font-size:.85rem;margin-right:6px}
/* painel lateral */
aside.help{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:1000px){aside.help{position:static}}
.helpcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.helpcard h3{font-family:var(--f-display);font-size:1rem;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.helpcard p{margin:0 0 8px;font-size:.93rem}
.helpcard p:last-child{margin-bottom:0}
.helpcard .q{font-weight:700;color:var(--steel)}
.summary dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.summary dt{color:var(--muted);font-size:.9rem}
.summary dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.summary-block{display:flex;flex-direction:column;gap:14px}
.summary-block h4{margin:0;font-family:var(--f-display);font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:4px}
textarea{width:100%;min-height:160px;font-family:var(--f-mono);font-size:.8rem;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:10px}
.toast{font-size:.9rem;color:var(--ok);font-weight:600}
.choice .ico svg{width:72px;height:46px;display:block}
svg .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg .f{fill:var(--steel-soft);stroke:var(--ink);stroke-width:1.5}
svg .a{fill:var(--accent)} svg .w{fill:var(--surface);stroke:var(--steel);stroke-width:1.2}
.quick{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px dashed var(--accent);border-radius:8px;margin-bottom:20px;font-size:.95rem}
.viz{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seg{display:flex;align-items:center;padding:0 8px;font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;color:var(--surface)}
.seg.sal,.sw.sal{background:var(--steel)} .seg.enc,.sw.enc{background:var(--accent)}
.seg.cd,.sw.cd{background:var(--steel)} .seg.adm,.sw.adm{background:#7c9a94} .seg.df,.sw.df{background:#c9a26b} .seg.lu,.sw.lu{background:var(--ok)} .seg.tr,.sw.tr{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.vizcap{font-size:.9rem;color:var(--muted)}
svg.recipe{width:100%;height:auto;margin:4px 0 8px}
svg.recipe .wall rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
svg.recipe .m{font-family:var(--f-mono);font-size:11px;fill:var(--ink)} svg.recipe .t{font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--steel)}
svg.section{width:100%;height:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
svg.section .soil{fill:var(--line)} svg.section .c3{fill:var(--muted)} svg.section .c4{fill:var(--steel)}
svg.section .c5{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1} svg.section .c12{fill:var(--surface);stroke:var(--steel);stroke-width:2} svg.section .c6{fill:var(--accent)}
svg.section .lbl text{font-family:var(--f-mono);font-size:12px;font-weight:600;fill:var(--ink)}
@media (prefers-reduced-motion:no-preference){.choice,nav.steps button{transition:background .15s,border-color .15s}}
.baseinfo{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.9rem}
header.top a{color:var(--steel);font-weight:700}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>OBIM <span>Orça</span></h1>
    <p>Assistente para montar a base de um orçamento de obra, passo a passo e com explicação em cada campo. <a href="orcamento.html">Lançar serviços</a> · <a href="busca.html">Consultar a base SINAPI</a></p>
  </header>

  <div class="grid">
    <nav class="steps" id="stepsNav" aria-label="Etapas do assistente"></nav>
    <main class="sheet" id="sheet" aria-live="polite"></main>
    <aside class="help" id="help"></aside>
  </div>
</div>

<script>
(function(){
const UFS=["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
const BASES_EST={SE:"ORSE",CE:"SEINFRA-CE",RJ:"EMOP",MG:"SUDECAP (BH)",GO:"GOINFRA",SP:"CPOS / SIURB"};
// Faixas do Acórdão TCU 2622/2013 para "Construção de edifícios" (1º quartil, médio, 3º quartil)
const BDI_REF={
  ac:{nome:"Administração central",q:[3.00,4.00,5.50],why:"Custos do escritório da construtora que não ficam na obra: contador, aluguel, telefone, engenheiro que acompanha várias obras. Cada obra paga uma parte."},
  sg:{nome:"Seguro e garantia",q:[0.80,0.80,1.00],why:"Seguro da obra (incêndio, roubo, responsabilidade civil) e garantias exigidas no contrato."},
  r:{nome:"Risco",q:[0.97,1.27,1.27],why:"Reserva para imprevistos que o orçamento não previu: chuva, solo pior que o esperado, perda de material."},
  df:{nome:"Despesas financeiras",q:[0.59,1.23,1.39],why:"Custo de bancar a obra com dinheiro próprio entre o gasto e o recebimento (juros, inflação do período)."},
  l:{nome:"Lucro",q:[6.16,7.40,8.96],why:"A remuneração da empresa pelo trabalho. É o que sobra depois de pagar tudo."}
};
const ETAPAS={
  base:[
    ["01","Serviços preliminares","Placa de obra, ligação provisória de água e luz, barracão, limpeza do terreno e locação da obra (gabarito)."],
    ["02","Movimento de terra","Escavações, aterro e compactação para nivelar o terreno e abrir as valas da fundação."],
    ["03","Fundações","Sapatas, estacas, blocos e vigas baldrame: a parte que leva o peso da casa para o solo."],
    ["04","Estrutura","Pilares, vigas e lajes de concreto armado (fôrma, armação e concreto)."],
    ["05","Alvenaria e vedações","Paredes de bloco cerâmico ou de concreto, vergas e contravergas."],
    ["06","Cobertura","Estrutura do telhado (madeira ou metálica), telhas, rufos e calhas."],
    ["07","Impermeabilização","Proteção contra umidade no baldrame, áreas molhadas e lajes expostas."],
    ["08","Instalações hidrossanitárias","Água fria e quente, esgoto, águas pluviais, louças e metais."],
    ["09","Instalações elétricas","Quadro, eletrodutos, fiação, tomadas, interruptores e entrada de energia."],
    ["10","Revestimentos","Chapisco, emboço, reboco, cerâmicas e porcelanatos em paredes."],
    ["11","Pisos","Contrapiso, piso cerâmico ou porcelanato, rodapés e soleiras."],
    ["12","Esquadrias","Portas, janelas, ferragens e vidros."],
    ["13","Pintura","Massa, selador e tinta nas paredes, tetos e esquadrias."],
    ["14","Serviços complementares","Calçada, muro, paisagismo e limpeza final da obra."]
  ],
  sobrado:[["E1","Escada","Escada de concreto ou metálica entre os pavimentos, com corrimão e guarda-corpo."]],
  predio:[["E1","Escada e circulação","Escadas, halls e áreas comuns."],["E2","Elevador","Fornecimento e instalação do elevador e casa de máquinas."],["E3","Prevenção de incêndio","Hidrantes, extintores, sinalização e iluminação de emergência exigidos pelos bombeiros."],["E4","Áreas comuns","Portaria, garagem, salão de festas e paisagismo do condomínio."]]
};

// Estado inicial: exemplo marcado como exemplo
const DEFAULT={
  exemplo:true,
  nome:"Casa Térrea – Exemplo", cliente:"", cidade:"Goiânia", tipo:"terrea", area:120, padrao:"normal",
  uf:"GO", mes:"2026-09", base:"SINAPI", desonerado:"nao",
  bdi:{ac:4.00,sg:0.80,r:1.27,df:1.23,l:7.40}, preset:1,
  pis:0.65, cofins:3.00, issAliq:3.00, issBase:50, cprb:2.70,
  encargos:null, etapas:null
};
let S=load()||structuredClone(DEFAULT);
let META=null;
let cur=0;

function load(){try{const v=localStorage.getItem("obimorca.rascunho");return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem("obimorca.rascunho",JSON.stringify(S));return true}catch(e){return false}}
const fmt=(n,d=2)=>Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function encargosSugeridos(){return S.desonerado==="sim"?{h:84.5,m:47.0}:{h:113.0,m:71.0}}
function encargos(){return S.encargos||encargosSugeridos()}
function etapasLista(){
  let l=[...ETAPAS.base];
  if(S.tipo==="sobrado")l=l.concat(ETAPAS.sobrado);
  if(S.tipo==="predio")l=l.concat(ETAPAS.predio);
  return l;
}
function etapasSel(){const l=etapasLista();return S.etapas?l.filter(e=>S.etapas.includes(e[1])):l}
function issEf(){return S.issAliq*S.issBase/100}
function tributos(){return S.pis+S.cofins+issEf()+(S.desonerado==="sim"?S.cprb:0)}
function calcBDI(){
  const b=S.bdi,I=tributos()/100;
  return (((1+(b.ac+b.sg+b.r)/100)*(1+b.df/100)*(1+b.l/100))/(1-I)-1)*100;
}
// faixa TCU do BDI total para edificações (sem desoneração)
const BDI_FAIXA=[20.34,22.12,25.00];

const STEPS=[
 {t:"A obra",render:stepObra,help:helpObra},
 {t:"Local e base",render:stepBase,help:helpBase},
 {t:"Desoneração",render:stepDeson,help:helpDeson},
 {t:"Encargos sociais",render:stepEnc,help:helpEnc},
 {t:"BDI",render:stepBDI,help:helpBDI},
 {t:"Etapas da obra",render:stepEtapas,help:helpEtapas},
 {t:"Resumo",render:stepResumo,help:helpResumo}
];

function renderNav(){
  const nav=document.getElementById("stepsNav");
  nav.innerHTML=STEPS.map((s,i)=>`<button type="button" data-i="${i}" class="${i===cur?"cur":""} ${i<cur?"done":""}" ${i===cur?'aria-current="step"':""}><span class="n">${i<cur?"✓":i+1}</span>${s.t}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){
  renderNav();
  const st=STEPS[cur];
  document.getElementById("sheet").innerHTML=
    `<div class="eyebrow">Passo ${cur+1} de ${STEPS.length}${S.exemplo?' · <span class="tag ex">dados de exemplo</span>':""}</div>`+
    st.render()+
    `<div class="nav">${cur>0?`<button class="btn ghost" id="prev">Voltar</button>`:"<span></span>"}${cur<STEPS.length-1?`<button class="btn" id="next">Próximo: ${STEPS[cur+1].t}</button>`:""}</div>`;
  document.getElementById("help").innerHTML=st.help();
  const p=document.getElementById("prev"),n=document.getElementById("next");
  if(p)p.onclick=()=>go(cur-1); if(n)n.onclick=()=>go(cur+1);
  bind();
}
function bind(){
  document.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    const ev=el.type==="radio"||el.tagName==="SELECT"||el.type==="checkbox"?"change":"input";
    el.addEventListener(ev,()=>{
      let v=el.type==="number"?parseFloat(el.value.replace(",","."))||0:el.value;
      if(k.startsWith("bdi.")){S.bdi[k.slice(4)]=v;S.preset=null}
      else if(k.startsWith("enc.")){S.encargos={...encargos(),[k.slice(4)]:v}}
      else S[k]=v;
      if(k==="desonerado")S.encargos=null;
      if(k==="tipo")S.etapas=null;
      S.exemplo=false; save();
      if(el.dataset.rerender!==undefined)render(); else liveUpdate();
    });
  });
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    const q=+b.dataset.preset; for(const k in BDI_REF)S.bdi[k]=BDI_REF[k].q[q]; S.preset=q; S.exemplo=false; save(); render();
  });
  document.querySelectorAll("[data-etapa]").forEach(c=>c.onchange=()=>{
    const all=[...document.querySelectorAll("[data-etapa]")]; S.etapas=all.filter(x=>x.checked).map(x=>x.dataset.etapa); S.exemplo=false; save(); liveUpdate();
  });
  document.querySelectorAll("[data-why]").forEach(b=>b.onclick=()=>{
    const t=document.getElementById(b.dataset.why); if(t){t.hidden=!t.hidden; b.setAttribute("aria-expanded",String(!t.hidden))}
  });
  const um=document.getElementById("usarMes"); if(um)um.onclick=()=>{S.mes=META.referencia;save();render()};

  };
  const r=document.getElementById("reset"); if(r)r.onclick=()=>{
    const c=document.getElementById("resetConfirm"); c.hidden=false;
  };
  const rc=document.getElementById("resetYes"); if(rc)rc.onclick=()=>{S=structuredClone(DEFAULT);S.exemplo=false;S.nome="";S.cidade="";save();go(0)};
  const rn=document.getElementById("resetNo"); if(rn)rn.onclick=()=>document.getElementById("resetConfirm").hidden=true;
  const cp=document.getElementById("copy"); if(cp)cp.onclick=()=>{
    const ta=document.getElementById("resumoTxt"),msg=document.getElementById("copyMsg");
    navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent="Resumo copiado."}).catch(()=>{ta.select();msg.textContent="Texto selecionado. Use Ctrl+C para copiar."});
  };
}

function bdiResult(){
 const v=calcBDI(); let cls="ok",txt="Dentro da faixa do TCU para edificações";
 const desc=S.desonerado==="sim";
 if(!desc&&v<BDI_FAIXA[0]){cls="warn";txt="Abaixo da faixa usual. Confira se não esqueceu nada"}
 if(!desc&&v>BDI_FAIXA[2]){cls="warn";txt="Acima da faixa usual. Pode ser difícil justificar"}
 if(desc)txt="Com desoneração o BDI fica naturalmente mais alto, por causa da CPRB";
 return `<span>BDI calculado</span><span class="big">${fmt(v)}%</span><span class="status ${cls}">${txt}</span>`;
}
function stepBDI(){const b=S.bdi;return `
 <h2>BDI: o que vai além do custo direto</h2>
 <p class="lead">O custo direto é o que fica na obra: material e mão de obra. O BDI soma o resto, que é escritório, impostos, risco e lucro. Preço de venda = custo direto × (1 + BDI).</p>

  <div class="field"><span class="lbl">Comece por um ponto de partida</span>
   <div class="presets">
    <button type="button" class="btn small ${S.preset===0?"on":""}" data-preset="0">Enxuto (1º quartil)</button>
    <button type="button" class="btn small ${S.preset===1?"on":""}" data-preset="1">Médio (recomendado)</button>

  </div>
  <div class="tblwrap"><table>
   <thead><tr><th>Item</th><th class="num">Seu valor (%)</th><th class="num">Faixa TCU</th></tr></thead>
   <tbody>
   ${Object.entries(BDI_REF).map(([k,r])=>`<tr><td><b>${r.nome}</b><br><span class="hint">${r.why}</span></td><td class="num"><input type="number" step="0.01" aria-label="${r.nome}" data-k="bdi.${k}" value="${b[k]}"></td><td class="num range">${fmt(r.q[0])} a ${fmt(r.q[2])}</td></tr>`).join("")}
   </tbody>
  </table></div>
  <div class="field"><span class="lbl">Tributos sobre o faturamento</span>
   <div class="tblwrap"><table><tbody>
    <tr><td>PIS<br><span class="hint">Federal, regime de lucro presumido.</span></td><td class="num"><input type="number" step="0.01" aria-label="PIS" data-k="pis" value="${S.pis}"></td></tr>
    <tr><td>COFINS<br><span class="hint">Federal, regime de lucro presumido.</span></td><td class="num"><input type="number" step="0.01" aria-label="COFINS" data-k="cofins" value="${S.cofins}"></td></tr>
    <tr><td>ISS: alíquota do município<br><span class="hint">Entre 2% e 5%. Consulte a prefeitura de ${esc(S.cidade)||"sua cidade"}.</span></td><td class="num"><input type="number" step="0.01" aria-label="Alíquota ISS" data-k="issAliq" value="${S.issAliq}"></td></tr>
    <tr><td>ISS: base de cálculo (% do valor)<br><span class="hint">Muitas prefeituras cobram ISS só sobre a mão de obra, cerca de 40% a 60% do total.</span></td><td class="num"><input type="number" step="1" aria-label="Base ISS" data-k="issBase" value="${S.issBase}"><br><span class="range">ISS efetivo <span id="issEf">${fmt(issEf())}%</span></span></td></tr>
    ${S.desonerado==="sim"?`<tr><td>CPRB (desoneração)<br><span class="hint">2,7% em 2026, caindo até zerar em 2028.</span></td><td class="num"><input type="number" step="0.01" aria-label="CPRB" data-k="cprb" value="${S.cprb}"></td></tr>`:""}
    <tr><td><b>Total de tributos</b></td><td class="num"><b id="tribOut">${fmt(tributos())}%</b></td></tr>

function bdiViz(){
 const b=S.bdi,I=tributos()/100,cd=100;
 const adm=cd*(b.ac+b.sg+b.r)/100, df=(cd+adm)*b.df/100, lu=(cd+adm+df)*b.l/100, sub=cd+adm+df+lu, pv=sub/(1-I), tr=pv-sub;
 const parts=[["cd","Custo da obra",cd],["adm","Escritório, seguro e risco",adm],["df","Financeiro",df],["lu","Lucro",lu],["tr","Impostos",tr]];
 return `<div class="viz" role="img" aria-label="Composição do preço de venda">
  <div class="vizcap"><b>Para onde vai cada R$ ${fmt(pv)} cobrado do cliente</b> (a cada R$ 100,00 de custo da obra)</div>
  <div class="bar">${parts.map(p=>`<span class="seg ${p[0]}" style="width:${(p[2]/pv*100).toFixed(2)}%" title="${p[1]}: R$ ${fmt(p[2])}"></span>`).join("")}</div>
  <div class="legend">${parts.map(p=>`<span><i class="sw ${p[0]}"></i>${p[1]} <b>R$ ${fmt(p[2])}</b></span>`).join("")}</div></div>`}
function helpBDI(){const v=calcBDI();return `
 <div class="helpcard"><h3>Na prática</h3>
  <p>Um serviço que custa <b>R$ 100.000,00</b> na obra seria vendido por</p>
  <p style="font-family:var(--f-display);font-size:1.4rem;font-weight:800;color:var(--steel);margin:0">R$ ${fmt(100000*(1+v/100))}</p>
  <p>A diferença de R$ ${fmt(100000*v/100)} cobre o escritório, os impostos, o risco e o seu lucro.</p></div>
 <div class="helpcard"><h3>Erro comum</h3><p>Somar as porcentagens direto (4 + 0,8 + 1,27 + …). O BDI usa multiplicação porque o lucro e os impostos incidem sobre o valor já aumentado. A fórmula ao lado é a do TCU.</p></div>`}

function stepEtapas(){const sel=etapasSel().map(e=>e[1]);return `
 <h2>Etapas da obra</h2>
 <p class="lead">O orçamento é organizado em etapas, na ordem em que a obra acontece. Já marcamos as etapas típicas de ${S.tipo==="terrea"?"uma casa térrea":S.tipo==="sobrado"?"um sobrado":"um edifício residencial"}. Desmarque o que não fizer parte do seu projeto.</p>

  ${etapasLista().map(e=>`<label class="stage"><input type="checkbox" data-etapa="${esc(e[1])}" ${sel.includes(e[1])?"checked":""}><span><span class="code">${e[0]}</span><b>${e[1]}</b></span><small>${e[2]}</small></label>`).join("")}
 </div>

function resumoTexto(){const e=encargos();return [
 `ORÇAMENTO: ${S.nome||"(sem nome)"}`,
 `Cliente: ${S.cliente||"-"} | Cidade: ${S.cidade||"-"}/${S.uf}`,
 `Tipo: ${{terrea:"Casa térrea",sobrado:"Sobrado",predio:"Edifício residencial"}[S.tipo]} | Área: ${fmt(S.area,0)} m² | Padrão: ${S.padrao}`,
 `Base: ${S.base} ${S.uf} ${S.mes} | ${S.desonerado==="sim"?"Desonerado":"Não desonerado"}`,
 `Encargos: horista ${fmt(e.h)}% | mensalista ${fmt(e.m)}%`,
 `BDI: AC ${fmt(S.bdi.ac)} | S+G ${fmt(S.bdi.sg)} | R ${fmt(S.bdi.r)} | DF ${fmt(S.bdi.df)} | L ${fmt(S.bdi.l)} | Tributos ${fmt(tributos())} => BDI ${fmt(calcBDI())}%`,
 `Etapas: ${etapasSel().map(x=>x[0]+" "+x[1]).join("; ")}`
].join("\n")}

 <h2>Tudo pronto para lançar os serviços</h2>
 <p class="lead">Estas são as configurações do orçamento. Elas valem para todos os serviços que você lançar a seguir.</p>

  <div><h4>Obra</h4><dl>
   <dt>Nome</dt><dd>${esc(S.nome)||"—"}</dd><dt>Local</dt><dd>${esc(S.cidade)||"—"} / ${S.uf}</dd>
   <dt>Tipo</dt><dd>${{terrea:"Casa térrea",sobrado:"Sobrado",predio:"Edifício residencial"}[S.tipo]}, ${fmt(S.area,0)} m², padrão ${S.padrao}</dd></dl></div>
  <div><h4>Preços</h4><dl>
   <dt>Base</dt><dd>${S.base==="ESTADUAL"?(BASES_EST[S.uf]||"Estadual"):S.base==="PROPRIA"?"Planilha própria":"SINAPI"} · ${S.mes}</dd>
   <dt>Regime</dt><dd>${S.desonerado==="sim"?"Desonerado":"Não desonerado"}</dd>
   <dt>Encargos</dt><dd>Horista ${fmt(e.h)}% · Mensalista ${fmt(e.m)}%</dd></dl></div>
  <div><h4>BDI</h4><dl><dt>Total</dt><dd>${fmt(calcBDI())}%</dd><dt>Tributos</dt><dd>${fmt(tributos())}%</dd></dl></div>
  <div><h4>Etapas (${etapasSel().length})</h4><p class="hint" style="margin:0">${etapasSel().map(x=>x[1]).join(", ")}</p></div>

   <div class="presets"><a class="btn small" href="orcamento.html" style="text-decoration:none">Próximo: lançar serviços</a><button type="button" class="btn small ghost" id="copy">Copiar resumo</button><button type="button" class="btn small ghost" id="reset">Começar um orçamento novo</button><span class="toast" id="copyMsg" role="status"></span></div>
   <div class="note" id="resetConfirm" hidden>Isso apaga o rascunho atual deste navegador. <button type="button" class="btn small" id="resetYes">Apagar e começar</button> <button type="button" class="btn small ghost" id="resetNo">Cancelar</button></div>
  </div>
 </div>`}
function helpResumo(){return `
 <div class="helpcard"><h3>Próximas fases do projeto</h3>
  <p><b>Base de preços:</b> a SINAPI do seu estado carregada dentro do site, com busca por descrição.</p>
  <p><b>Lançar serviços:</b> importar os quantitativos do seu projeto e escolher a composição de cada um.</p>
  <p><b>Relatórios:</b> planilha sintética e analítica, curva ABC, cronograma e exportação.</p></div>
 <div class="helpcard"><h3>Seu rascunho</h3><p>Fica salvo só neste navegador. Em outro computador ou janela anônima ele não aparece.</p></div>`}

function mesExt(r){const[a,m]=r.split("-");return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+m-1]+"/"+a}
fetch("dados/sinapi/meta.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(m=>{
  META=m; if(m&&m.referencia&&(S.exemplo||S.mes>m.referencia)){S.mes=m.referencia;save()}
  render();
}).catch(()=>{});
render();
})();
</script>
